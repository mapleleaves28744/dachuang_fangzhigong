<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的空间</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared/auth-ui.css">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --line: #dbe4ef;
            --panel: #ffffff;
            --brand: #0f5bd8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Manrope", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: #ffffff;
            color: var(--ink);
        }

        .global-sidebar-toggle {
            position: fixed;
            left: 12px;
            top: 12px;
            width: 42px;
            height: 42px;
            border: 1px solid #d8e2f1;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
            color: #0f172a;
            font-size: 20px;
            cursor: pointer;
            z-index: 1400;
        }

        body.sidebar-open .global-sidebar-toggle {
            opacity: 0;
            pointer-events: none;
        }

        .global-sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            display: none;
            z-index: 1290;
        }

        .global-sidebar-backdrop.show { display: block; }

        .global-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #f8fafd;
            border-right: 1px solid #dbe4ef;
            box-shadow: 12px 0 26px rgba(15, 23, 42, 0.12);
            transform: translateX(-100%);
            transition: transform 0.22s ease;
            z-index: 1300;
            display: flex;
            flex-direction: column;
            padding: 16px 14px;
        }

        .global-sidebar-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 2px;
        }

        .global-sidebar.open { transform: translateX(0); }

        .global-sidebar-logo {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 16px;
            color: #0f172a;
        }

        .global-sidebar-link {
            display: block;
            text-decoration: none;
            color: #1f2937;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            font-weight: 700;
            background: transparent;
        }

        .global-sidebar-link:hover {
            background: #eef4ff;
            border-color: #d4e1f7;
        }

        .global-sidebar-link.active {
            background: #e8f0ff;
            border-color: #bfd4f6;
            color: #1d4ed8;
        }

        .global-sidebar-section {
            margin-top: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
        }

        .wrap {
            max-width: 1320px;
            margin: 0 auto;
            padding: 20px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .btn {
            border: 1px solid #cfe0f8;
            background: #f5f9ff;
            color: #1d4ed8;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn.danger {
            border-color: #f3c9c9;
            background: #fff5f5;
            color: #c24141;
        }

        .layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 14px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
            padding: 12px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .space-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 72vh;
            overflow-y: auto;
        }

        .space-card {
            width: 100%;
            text-align: left;
            border: 1px solid #dee6f2;
            border-radius: 12px;
            background: #ffffff;
            padding: 10px;
            cursor: pointer;
        }

        .space-card.active {
            border-color: #84aef0;
            background: #f8fbff;
            box-shadow: 0 6px 16px rgba(29, 78, 216, 0.1);
        }

        .space-name {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .space-meta {
            font-size: 12px;
            color: var(--muted);
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .item-card {
            border: 1px solid #e2e8f4;
            border-radius: 12px;
            background: #ffffff;
            padding: 10px;
            cursor: pointer;
        }

        .item-card.active {
            border-color: #84aef0;
            background: #f8fbff;
        }

        .item-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 2px;
            word-break: break-all;
        }

        .item-meta {
            font-size: 11px;
            color: var(--muted);
        }

        .item-snippet {
            margin-top: 6px;
            font-size: 12px;
            line-height: 1.55;
            color: #475569;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .viewer {
            border: 1px dashed #d5e0ef;
            border-radius: 12px;
            background: #fafcff;
            padding: 10px;
            min-height: 320px;
        }

        .viewer-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .viewer-meta {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .viewer-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .viewer-summary {
            margin-bottom: 10px;
            border: 1px dashed #d5e0ef;
            border-radius: 10px;
            background: #ffffff;
            padding: 10px;
            color: #475569;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .viewer-body img {
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid #dbe4ef;
        }

        .viewer-body video {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #dbe4ef;
            background: #0f172a;
        }

        .viewer-body iframe {
            width: 100%;
            min-height: 420px;
            border: 1px solid #dbe4ef;
            border-radius: 10px;
            background: #ffffff;
        }

        .viewer-body audio {
            width: 100%;
        }

        .viewer-body pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #ffffff;
            border: 1px solid #e2e8f4;
            border-radius: 10px;
            padding: 10px;
            color: #1f2937;
            font-size: 13px;
            line-height: 1.6;
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .item-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <button class="global-sidebar-toggle" id="globalSidebarToggle" type="button" aria-label="打开侧栏">☰</button>
    <div class="global-sidebar-backdrop" id="globalSidebarBackdrop"></div>
    <aside class="global-sidebar" id="globalSidebar">
        <div class="global-sidebar-scroll">
            <div class="global-sidebar-logo">坊知工</div>
            <a class="global-sidebar-link" data-side-link="index.html" href="index.html">+ 添加内容</a>
            <a class="global-sidebar-link" data-side-link="chat.html" href="chat.html">◎ 智能问答</a>
            <a class="global-sidebar-link" data-side-link="question-bank.html" href="question-bank.html">◎ 题库练习</a>
            <a class="global-sidebar-link" data-side-link="dashboard.html" href="dashboard.html">◧ 学习仪表盘</a>
            <a class="global-sidebar-link" data-side-link="knowledge-map.html" href="knowledge-map.html">◇ 知识图谱</a>
            <div class="global-sidebar-section">空间</div>
            <a class="global-sidebar-link" data-side-link="spaces.html" href="spaces.html">◻ 我的空间</a>
        </div>
    </aside>

    <div class="wrap">
        <div class="topbar">
            <div>
                <div class="title">我的空间</div>
                <div class="subtitle" id="spaceUserLabel">用户：-</div>
            </div>
            <div class="topbar-actions">
                <button class="btn" id="createSpaceBtn" type="button">新建空间</button>
                <button class="btn danger" id="deleteSpaceBtn" type="button">删除当前空间</button>
                <a class="btn" href="index.html">返回首页</a>
            </div>
        </div>

        <div class="layout">
            <section class="panel">
                <div class="panel-title">空间列表</div>
                <div class="space-list" id="spaceList"></div>
            </section>

            <section class="panel">
                <div class="panel-title" id="itemPanelTitle">空间内容</div>
                <div class="item-grid" id="itemGrid"></div>
                <div class="viewer" id="itemViewer">
                    <div class="hint">点击左侧空间和内容项查看详情。</div>
                </div>
            </section>
        </div>
    </div>

    <script src="assets/js/shared/user-context.js?v=20260330-authfix"></script>
    <script src="assets/js/shared/api-utils.js?v=20260330-authfix"></script>
    <script src="assets/js/shared/project-local-data.js?v=20260330-authfix"></script>
    <script src="assets/js/shared/space-cloud-store.js?v=20260330-spacecloud"></script>
    <script src="assets/js/shared/auth-ui.js?v=20260330-authfix"></script>
    <script src="assets/js/shared/page-shell.js?v=20260331-telemetryfix"></script>
    <script src="assets/js/pages/spaces-page.js?v=20260330-spacecloud"></script>
</body>
</html>
