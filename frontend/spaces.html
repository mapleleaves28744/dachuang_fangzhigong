<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的空间</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared/auth-ui.css?v=20260403-space-root-nav">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #667085;
            --line: #e5e7eb;
            --soft-line: #eef2f7;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --brand: #111111;
            --danger: #c62828;
            --shadow-lg: 0 24px 70px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 16px 34px rgba(15, 23, 42, 0.08);
            --shadow-sm: 0 10px 24px rgba(15, 23, 42, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Manrope", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at top left, rgba(245, 247, 250, 0.95), rgba(255, 255, 255, 0.98) 30%) fixed;
            color: var(--ink);
            min-height: 100vh;
            font-size: 15px;
        }

        body.space-modal-open {
            overflow: hidden;
        }

        .global-sidebar-toggle {
            position: fixed;
            left: 18px;
            top: 16px;
            width: 52px;
            height: 52px;
            border: 1px solid #dde4ef;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 18px;
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
            color: #0f172a;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 1400;
        }

        .global-sidebar-toggle-icon {
            width: 21px;
            height: 16px;
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .global-sidebar-toggle-icon span {
            display: block;
            width: 100%;
            height: 2.4px;
            border-radius: 999px;
            background: #1f2937;
            transform-origin: center;
            transition: transform 0.18s ease, opacity 0.18s ease;
        }

        .global-sidebar-toggle[aria-expanded="true"] .global-sidebar-toggle-icon span:nth-child(1) {
            transform: translateY(6.8px) rotate(45deg);
        }

        .global-sidebar-toggle[aria-expanded="true"] .global-sidebar-toggle-icon span:nth-child(2) {
            opacity: 0;
        }

        .global-sidebar-toggle[aria-expanded="true"] .global-sidebar-toggle-icon span:nth-child(3) {
            transform: translateY(-6.8px) rotate(-45deg);
        }

        body.sidebar-open .global-sidebar-toggle {
            opacity: 0;
            pointer-events: none;
        }

        .global-sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.22);
            display: none;
            z-index: 1290;
        }

        .global-sidebar-backdrop.show { display: block; }

        .global-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #f8fafd;
            border-right: 1px solid #dbe4ef;
            box-shadow: 12px 0 26px rgba(15, 23, 42, 0.12);
            transform: translateX(-100%);
            transition: transform 0.22s ease;
            z-index: 1300;
            display: flex;
            flex-direction: column;
            padding: 16px 14px;
        }

        .global-sidebar.open { transform: translateX(0); }

        .global-sidebar-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-right: 2px;
        }

        .global-sidebar-logo {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 16px;
            color: #0f172a;
        }

        .global-sidebar-link {
            display: block;
            text-decoration: none;
            color: #1f2937;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 6px;
            font-weight: 700;
            background: transparent;
        }

        .global-sidebar-link:hover {
            background: #eef4ff;
            border-color: #d4e1f7;
        }

        .global-sidebar-link.active {
            background: #e8f0ff;
            border-color: #bfd4f6;
            color: #1d4ed8;
        }

        .global-sidebar-section {
            margin-top: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #64748b;
            font-weight: 700;
        }

        .space-shell-topbar {
            position: sticky;
            top: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 18px 28px 14px 88px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
        }

        .space-shell-brand {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }

        .space-brand-mark {
            width: 40px;
            height: 34px;
            display: inline-flex;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .space-brand-mark span {
            display: block;
            width: 10px;
            border-radius: 999px;
            background: #111111;
        }

        .space-brand-mark span:nth-child(1) { height: 28px; }
        .space-brand-mark span:nth-child(2) { height: 28px; }
        .space-brand-mark span:nth-child(3) { height: 12px; }

        .space-shell-context {
            min-width: 0;
        }

        .space-shell-context-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #98a2b3;
            margin-bottom: 2px;
        }

        .space-shell-context-name {
            font-size: 15px;
            font-weight: 800;
            color: #101828;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: min(42vw, 520px);
        }

        .space-shell-user {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        .space-page {
            width: min(100%, 1560px);
            margin: 0 auto;
            padding: 30px 56px 56px;
        }

        .space-reader {
            width: 100%;
            min-height: 100vh;
            padding: 22px 24px 28px;
        }

        .space-reader-topbar {
            width: min(100%, 1360px);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .space-reader-back {
            border: 1px solid #d0d5dd;
            background: rgba(255, 255, 255, 0.96);
            color: #101828;
            border-radius: 999px;
            min-height: 44px;
            padding: 0 18px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .space-reader-file {
            min-width: 0;
            font-size: 14px;
            font-weight: 700;
            color: #667085;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .space-reader-body {
            width: min(100%, 1360px);
            margin: 0 auto;
        }

        .space-reader-document {
            min-height: calc(100vh - 116px);
            border: 1px solid #e5e7eb;
            border-radius: 28px;
            background: #ffffff;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .space-reader-document.is-text {
            width: min(100%, 960px);
            margin: 0 auto;
            min-height: auto;
            padding: 52px 56px 56px;
        }

        .space-reader-document.is-pdf {
            background: #eef2f7;
            padding: 26px 0;
        }

        .space-reader-document.is-text pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 18px;
            line-height: 1.95;
            color: #101828;
        }

        .space-reader-pdf {
            width: min(100%, 1120px);
            margin: 0 auto;
            display: grid;
            gap: 20px;
            padding: 0 24px;
        }

        .space-reader-pdf-page {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 18px 34px rgba(15, 23, 42, 0.08);
        }

        .space-reader-pdf-page canvas {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
        }

        .space-reader-frame {
            width: 100%;
            min-height: calc(100vh - 116px);
            border: none;
            background: #ffffff;
            display: block;
        }

        .space-reader-media {
            min-height: calc(100vh - 116px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: #ffffff;
        }

        .space-reader-media img,
        .space-reader-media video {
            max-width: 100%;
            max-height: calc(100vh - 180px);
            display: block;
        }

        .space-reader-media audio {
            width: min(100%, 760px);
        }

        .space-reader-note {
            min-height: calc(100vh - 116px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            color: #667085;
            font-size: 16px;
            text-align: center;
            line-height: 1.8;
        }

        .space-reader-loading {
            min-height: calc(100vh - 220px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #667085;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        body.space-reader-mode {
            background: #f3f4f6;
        }

        body.space-reader-mode .global-sidebar-toggle,
        body.space-reader-mode .global-sidebar-backdrop,
        body.space-reader-mode .global-sidebar,
        body.space-reader-mode .space-shell-topbar {
            display: none;
        }

        .space-hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 42px;
        }

        .space-hero-copy {
            max-width: 720px;
        }

        .space-title-wrap {
            min-height: 80px;
        }

        .space-description-wrap {
            margin-top: 10px;
            min-height: 40px;
        }

        .editable-shell {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
        }

        .editable-trigger {
            border: none;
            background: transparent;
            color: inherit;
            text-align: left;
            padding: 0;
            cursor: text;
        }

        .space-title-wrap .editable-trigger {
            font-size: clamp(30px, 4vw, 46px);
            font-weight: 900;
            line-height: 1.06;
            letter-spacing: -0.04em;
        }

        .space-description-wrap .editable-trigger {
            font-size: 18px;
            font-weight: 500;
            color: #667085;
            line-height: 1.45;
        }

        .editable-trigger.is-empty {
            color: #98a2b3;
        }

        .space-name-input,
        .space-description-input {
            width: min(100%, 760px);
            border: none;
            border-bottom: 2px solid #d0d5dd;
            background: transparent;
            color: #101828;
            padding: 0 0 10px;
            resize: none;
        }

        .space-name-input {
            font-size: clamp(30px, 4vw, 46px);
            font-weight: 900;
            line-height: 1.06;
            letter-spacing: -0.04em;
        }

        .space-description-input {
            min-height: 64px;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.45;
        }

        .space-name-input:focus,
        .space-description-input:focus {
            outline: none;
            border-color: #111111;
        }

        .editable-hint {
            font-size: 12px;
            color: #98a2b3;
        }

        .space-hero-actions {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
            flex-shrink: 0;
            padding-top: 16px;
        }

        .space-action-btn {
            height: 48px;
            border-radius: 20px;
            border: 1px solid #111111;
            background: #111111;
            color: #ffffff;
            padding: 0 20px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }

        .space-action-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .space-action-btn .btn-plus {
            font-size: 24px;
            line-height: 1;
        }

        .space-more-wrap {
            position: relative;
        }

        .space-more-btn {
            width: 52px;
            height: 52px;
            border-radius: 20px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
            color: #101828;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .space-more-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .space-more-btn::before,
        .space-more-btn::after,
        .space-more-btn span {
            content: "";
            width: 4px;
            height: 4px;
            border-radius: 999px;
            background: currentColor;
            display: block;
        }

        .space-more-btn span {
            margin: 5px 0;
        }

        .space-more-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 12px);
            min-width: 210px;
            padding: 8px;
            border: 1px solid #e4e7ec;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: var(--shadow-md);
            display: none;
        }

        .space-more-menu.show {
            display: block;
        }

        .space-more-menu-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: #111827;
            font-size: 15px;
            font-weight: 700;
            text-align: left;
            padding: 14px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .space-more-menu-btn:hover {
            background: #f8fafc;
        }

        .space-more-menu-btn svg {
            width: 20px;
            height: 20px;
        }

        .space-table {
            border-top: 1px solid var(--line);
        }

        .space-table-head,
        .space-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 200px 58px;
            align-items: center;
            gap: 16px;
        }

        .space-table-head {
            min-height: 60px;
            color: #667085;
            font-size: 14px;
            font-weight: 700;
            border-bottom: 1px solid var(--line);
        }

        .space-table-head-title {
            padding-left: 18px;
        }

        .space-table-head-added {
            text-align: left;
        }

        .space-row {
            position: relative;
            min-height: 82px;
            border-bottom: 1px solid var(--soft-line);
        }

        .space-row-main {
            border: none;
            background: transparent;
            width: 100%;
            min-height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0 0 18px;
            cursor: pointer;
            text-align: left;
            color: inherit;
        }

        .space-row-main-left {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .space-row-icon {
            width: 24px;
            height: 24px;
            color: #6b7280;
            flex-shrink: 0;
        }

        .space-row-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .space-row-name {
            font-size: 17px;
            font-weight: 700;
            color: #101828;
            word-break: break-word;
        }

        .space-row-added {
            color: #667085;
            font-size: 14px;
            font-weight: 500;
        }

        .space-row-actions {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .space-row-menu-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #111827;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 3px;
            border-radius: 10px;
        }

        .space-row-menu-btn:hover {
            background: #f3f4f6;
        }

        .space-row-menu-btn span {
            width: 4px;
            height: 4px;
            border-radius: 999px;
            background: currentColor;
            display: block;
        }

        .item-menu {
            position: absolute;
            top: calc(100% - 6px);
            right: 0;
            width: 256px;
            border: 1px solid #e4e7ec;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: var(--shadow-md);
            padding: 8px;
            display: none;
            z-index: 8;
        }

        .item-menu.is-open {
            display: block;
        }

        .item-menu-btn {
            width: 100%;
            border: none;
            background: transparent;
            border-radius: 14px;
            min-height: 44px;
            padding: 11px 14px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #111827;
            cursor: pointer;
        }

        .item-menu-btn:hover {
            background: #f8fafc;
        }

        .item-menu-btn.danger {
            color: var(--danger);
        }

        .item-menu-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .item-menu-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .item-menu-btn.has-arrow {
            justify-content: space-between;
        }

        .item-menu-btn.has-arrow > span:nth-child(2) {
            flex: 1;
        }

        .item-menu-arrow {
            font-size: 22px;
            line-height: 1;
            color: #667085;
        }

        .item-move-panel {
            display: none;
            margin: 2px 0 8px;
            padding: 6px 0 2px 32px;
        }

        .item-move-panel.is-open {
            display: block;
        }

        .item-move-target,
        .item-move-empty {
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #475467;
        }

        .item-move-target {
            cursor: pointer;
        }

        .item-move-target:hover {
            background: #f8fafc;
            color: #111827;
        }

        .space-list-empty,
        .space-empty-state {
            margin-top: 28px;
            border: 1px dashed #d0d5dd;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.86);
            padding: 40px;
            text-align: center;
        }

        .space-list-empty-title,
        .space-empty-title {
            font-size: 20px;
            font-weight: 800;
            color: #101828;
        }

        .space-list-empty-subtitle,
        .space-empty-subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #667085;
        }

        .space-empty-btn {
            margin-top: 20px;
            height: 48px;
            border-radius: 16px;
            border: none;
            background: #111111;
            color: #ffffff;
            padding: 0 22px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .content-modal,
        .item-preview-modal,
        .item-properties-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.26);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1500;
        }

        .content-modal.show,
        .item-preview-modal.show,
        .item-properties-modal.show {
            display: flex;
        }

        .content-modal-card,
        .item-preview-card,
        .item-properties-card {
            width: min(100%, 1180px);
            max-height: min(90vh, 860px);
            overflow: auto;
            background: #ffffff;
            border-radius: 30px;
            border: 1px solid #e5e7eb;
            box-shadow: var(--shadow-lg);
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.9) rgba(241, 245, 249, 0.95);
            scrollbar-gutter: stable both-edges;
        }

        .content-modal-card::-webkit-scrollbar,
        .item-preview-card::-webkit-scrollbar,
        .item-properties-card::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .content-modal-card::-webkit-scrollbar-track,
        .item-preview-card::-webkit-scrollbar-track,
        .item-properties-card::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.95);
            border-radius: 999px;
            margin: 10px;
        }

        .content-modal-card::-webkit-scrollbar-thumb,
        .item-preview-card::-webkit-scrollbar-thumb,
        .item-properties-card::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.9);
            border-radius: 999px;
            border: 2px solid rgba(241, 245, 249, 0.95);
        }

        .content-modal-card {
            padding: 24px 28px 28px;
        }

        .content-modal-head,
        .item-preview-head,
        .item-properties-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .content-modal-headline {
            text-align: center;
            font-size: clamp(28px, 3.4vw, 42px);
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: -0.04em;
            margin: 18px auto 28px;
        }

        .content-modal-close,
        .item-preview-close,
        .item-properties-close {
            border: none;
            background: #f3f4f6;
            color: #111827;
            border-radius: 14px;
            min-width: 74px;
            height: 42px;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .content-mode-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .content-mode-card {
            border: 1px solid #d0d5dd;
            border-radius: 24px;
            background: #ffffff;
            padding: 22px 24px;
            min-height: 138px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
        }

        .content-mode-card:hover,
        .content-mode-card.active {
            transform: translateY(-1px);
            border-color: #111111;
            box-shadow: var(--shadow-sm);
        }

        .content-mode-icon {
            width: 34px;
            height: 34px;
            color: #666666;
            margin-bottom: 12px;
        }

        .content-mode-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .content-mode-title {
            font-size: 20px;
            font-weight: 800;
            color: #101828;
        }

        .content-mode-desc {
            margin-top: 4px;
            color: #667085;
            font-size: 14px;
            line-height: 1.45;
        }

        .content-modal-form {
            margin-top: 18px;
            border: 1px solid #e4e7ec;
            border-radius: 24px;
            background: #fcfcfd;
            padding: 22px;
        }

        .content-field-grid {
            display: grid;
            gap: 12px;
        }

        .content-input,
        .content-textarea,
        .content-file {
            width: 100%;
            border: 1px solid #d0d5dd;
            border-radius: 18px;
            background: #ffffff;
            padding: 14px 16px;
            font-size: 15px;
            color: #101828;
        }

        .content-textarea {
            min-height: 152px;
            resize: vertical;
        }

        .content-input:focus,
        .content-textarea:focus,
        .content-file:focus {
            outline: none;
            border-color: #111111;
        }

        .content-file-note,
        .content-record-status,
        .content-modal-result {
            margin-top: 10px;
            font-size: 14px;
            color: #667085;
        }

        .content-record-controls {
            margin-top: 12px;
            padding: 16px 18px;
            border: 1px solid #e4e7ec;
            border-radius: 20px;
            background: #ffffff;
        }

        .content-record-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .content-record-btn {
            height: 40px;
            border-radius: 999px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .content-record-btn.primary {
            border-color: #111111;
            background: #111111;
            color: #ffffff;
        }

        .content-record-audio {
            width: 100%;
            margin-top: 12px;
            display: none;
        }

        .content-modal-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }

        .content-footer-btn {
            height: 46px;
            border-radius: 16px;
            border: 1px solid #d0d5dd;
            background: #ffffff;
            color: #101828;
            padding: 0 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .content-footer-btn.primary {
            border-color: #111111;
            background: #111111;
            color: #ffffff;
        }

        .item-preview-card {
            width: min(100%, 860px);
            padding: 24px 24px 26px;
        }

        .item-preview-title {
            font-size: 22px;
            font-weight: 900;
            color: #101828;
            line-height: 1.15;
        }

        .item-preview-meta {
            margin-top: 8px;
            color: #667085;
            font-size: 13px;
        }

        .item-preview-body {
            margin-top: 14px;
            border: 1px solid #e4e7ec;
            border-radius: 22px;
            padding: 18px;
            background: #ffffff;
            min-height: 180px;
        }

        .item-preview-body img,
        .item-preview-body video,
        .item-preview-body audio {
            width: 100%;
            max-width: 100%;
            display: block;
        }

        .item-preview-body iframe {
            width: 100%;
            min-height: 420px;
            border: none;
            border-radius: 14px;
            background: #ffffff;
        }

        .item-preview-body pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.7;
            color: #1f2937;
        }

        .preview-note {
            color: #667085;
            font-size: 14px;
        }

        .item-properties-card {
            width: min(100%, 760px);
            padding: 24px 24px 26px;
        }

        .item-properties-title {
            font-size: 22px;
            font-weight: 900;
            color: #101828;
            line-height: 1.15;
        }

        .item-properties-meta {
            margin-top: 8px;
            color: #667085;
            font-size: 13px;
        }

        .item-properties-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .item-properties-row {
            border: 1px solid #e4e7ec;
            border-radius: 18px;
            background: #f8fafc;
            padding: 14px 16px;
        }

        .item-properties-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #98a2b3;
            text-transform: uppercase;
        }

        .item-properties-value {
            margin-top: 8px;
            color: #1f2937;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .item-properties-summary {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 18px;
            background: #f8fafc;
            color: #344054;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 1080px) {
            .space-page {
                padding: 24px 22px 48px;
            }

            .space-reader {
                padding: 18px 18px 24px;
            }

            .space-hero {
                flex-direction: column;
            }

            .space-shell-topbar {
                padding-right: 20px;
            }

            .content-mode-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .space-shell-topbar {
                padding: 16px 16px 12px 82px;
                align-items: flex-start;
                flex-direction: column;
            }

            .space-shell-user {
                white-space: normal;
            }

            .space-reader-topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .space-reader-file {
                text-align: left;
            }

            .space-reader-document.is-text {
                padding: 30px 22px 34px;
                border-radius: 22px;
            }

            .space-reader-document.is-pdf {
                padding: 16px 0;
                border-radius: 22px;
            }

            .space-reader-document.is-text pre {
                font-size: 16px;
                line-height: 1.85;
            }

            .space-reader-pdf {
                padding: 0 12px;
                gap: 14px;
            }

            .space-table-head {
                display: none;
            }

            .space-row {
                grid-template-columns: minmax(0, 1fr) 42px;
                padding: 14px 0;
            }

            .space-row-main {
                min-height: 0;
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
                padding-left: 12px;
            }

            .space-row-main-left,
            .space-row-main-right {
                width: 100%;
            }

            .space-row-added {
                display: block;
                padding-left: 42px;
            }

            .content-mode-grid {
                grid-template-columns: 1fr;
            }

            .content-modal-card,
            .item-preview-card,
            .item-properties-card {
                padding: 22px 18px 24px;
                border-radius: 24px;
            }

            .item-properties-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                <div class="space-more-wrap">
                    <button class="space-more-btn" id="spaceMoreBtn" type="button" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false">
                        <span aria-hidden="true"></span>
                    </button>

                        <button class="space-more-menu-btn" id="createFolderBtn" type="button">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6A2.5 2.5 0 0 1 20.5 9.5v7A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
